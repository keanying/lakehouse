<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PFT3.0 数仓字典</title>
<style>
:root{--bg:#f3f4ef;--panel:#fff;--line:#e3e6ec;--line2:#eef0f4;--text:#1b2233;--sub:#4b5568;--muted:#7b8497;--brand:#2f3a12;--brand-soft:#eef7cf;
--ODS:#7a5af8;--DWD:#0e9384;--DIM:#d9770a;--DWS:#3a5bd9;--ADS:#d92d78;
--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC","Segoe UI",sans-serif;color:var(--text);background:var(--bg)}
button,input,select{font:inherit;color:inherit}
a{color:var(--brand);cursor:pointer;text-decoration:none}a:hover{text-decoration:underline}
.app{display:flex;height:100vh}
/* 左侧极简导航：黑色竖向胶囊，仅图标 */
.app{padding:14px;gap:14px;background:#e9ebe4}
.rail{width:56px;flex:none;background:#000;border-radius:28px;display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:10px}
.rail .lg{width:30px;height:30px;border-radius:50%;border:3px solid #c6ef4e;border-top-color:transparent;margin:2px 0 14px}
.rail a{width:38px;height:38px;border-radius:50%;color:#8a8f98;display:grid;place-items:center;position:relative;text-decoration:none}
.rail a span{display:none;position:absolute;left:50px;background:#000;color:#fff;padding:3px 10px;border-radius:6px;font-size:12px;white-space:nowrap;z-index:30}
.rail a:hover span{display:block}
.rail a svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rail a:hover{color:#fff;background:#1c1c1c}
.rail a.on{background:#eaecdf;color:#000}
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg);border-radius:22px;overflow:hidden}
.top{height:52px;flex:none;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 20px}
.top h1{margin:0;font-size:16px;font-weight:650}
.top .desc{color:var(--muted);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.view{flex:1;min-height:0;padding:14px 20px 16px;display:flex;flex-direction:column;overflow:hidden}
.view.scroll{overflow:auto}
/* 工具栏 */
.bar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-bottom:10px}
.bar .grow{flex:1}
.inp{height:30px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:#fff;outline:none;min-width:240px}
.inp:focus,.sel:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.sel{height:30px;padding:0 8px;border:1px solid var(--line);border-radius:6px;background:#fff;max-width:200px;outline:none}
.sel.act{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.btn{height:30px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn:disabled{opacity:.4;cursor:default;border-color:var(--line);color:inherit}
.btn.pri{background:#000;border-color:#000;color:#c6ef4e}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:26px;padding:0 11px;border:1px solid var(--line);border-radius:13px;background:#fff;cursor:pointer;color:var(--sub);font-size:12.5px}
.chip:hover{border-color:var(--brand)}
.chip.on{background:#000;border-color:#000;color:#c6ef4e}
.chip i{font-style:normal;opacity:.6;margin-left:4px;font-size:11.5px}
.cnt{color:var(--muted);font-size:12px;white-space:nowrap}
/* 表格 */
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 2px rgba(20,30,60,.04)}
.tw{flex:1;min-height:0;overflow:auto;border-radius:10px}
table.t{border-collapse:separate;border-spacing:0;width:100%}
.t th{position:sticky;top:0;z-index:2;background:#f5f6f9;text-align:left;font-weight:600;font-size:12px;color:var(--sub);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
.t th:hover{color:var(--brand)}
.t td{padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:top;font-size:12.5px;background:#fff}
.t tbody tr:hover td{background:#f5f8ff}
.t tbody tr.sel td{background:var(--brand-soft)}
.t tbody tr{cursor:pointer}
.t.wide{width:max-content;min-width:100%}
.t.wide th:first-child,.t.wide td:first-child{position:sticky;left:0;z-index:1;box-shadow:inset -1px 0 0 var(--line)}
.t.wide th:first-child{z-index:3}
.c-s{white-space:nowrap}
.c-n{white-space:nowrap;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.c-id{font-family:var(--mono);font-size:12px;white-space:nowrap}
.c-m{min-width:140px;max-width:220px}
.c-l{min-width:260px;max-width:440px}
.c-fill{min-width:200px}
.c-cm{min-width:120px;max-width:200px}
.c-kou{min-width:200px}
.kou{color:#3d4a12}
.c-src{width:22%;font-size:12px;color:var(--sub);word-break:break-all}
.c-src .cl{display:-webkit-box}
.c-xl{min-width:320px;max-width:520px}
.cl{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;line-height:1.6}
.c-s .cl,.c-id .cl{display:block;overflow:visible}
.t td.c-id .cl{max-width:360px;overflow:hidden;text-overflow:ellipsis}
mark{background:#ffe98a;padding:0 1px;border-radius:2px}
.tag{display:inline-block;min-width:38px;text-align:center;padding:0 7px;border-radius:4px;font-size:11.5px;font-weight:600;color:#fff;line-height:19px;background:#98a2b3}
.tag.rt{outline:1.5px dashed rgba(0,0,0,.25);outline-offset:-3px}
.pill{display:inline-block;padding:0 7px;border-radius:4px;font-size:12px;line-height:19px;background:#eef0f5;color:var(--sub);white-space:nowrap}
.pill.g{background:#e6f6ec;color:#067647}.pill.o{background:#fff1de;color:#b54708}.pill.b{background:#e8eeff;color:#2d4bc0}.pill.p{background:#f3eaff;color:#6941c6}.pill.r{background:#fdecec;color:#b42318}
.pager{display:flex;justify-content:center;align-items:center;gap:10px;padding-top:10px;color:var(--muted)}
.empty{padding:40px;text-align:center;color:var(--muted)}
/* 总览 */
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px}
.lc{padding:14px 16px;border-top:3px solid var(--c);cursor:pointer;transition:.15s}
.lc:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(20,30,60,.1)}
.lc .k{font-weight:700;color:var(--c);font-size:12px;letter-spacing:.5px}
.lc .n{font-size:30px;font-weight:700;line-height:1.2}
.lc .n small{font-size:12px;color:var(--muted);font-weight:400;margin-left:4px}
.lc .d{color:var(--sub);font-size:12px;margin-top:2px}
.lc .x{color:var(--muted);font-size:12px;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.two{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;margin-bottom:14px}
.sec{padding:14px 16px}
.sec h3{margin:0 0 10px;font-size:14px}
.sec h3 small{color:var(--muted);font-weight:400;margin-left:6px}
.bars{display:grid;gap:7px}
.brow{display:grid;grid-template-columns:44px 1fr 64px;gap:10px;align-items:center;font-size:12.5px;cursor:pointer}
.brow:hover .bt{filter:brightness(.92)}
.bk{font-family:var(--mono);color:var(--sub)}
.bg{height:16px;background:#eff1f6;border-radius:4px;overflow:hidden;display:flex}
.bt{height:100%;background:var(--brand)}
.bn{text-align:right;color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.qk{padding:14px 16px;cursor:pointer}
.qk:hover{border-color:var(--brand)}
.qk b{display:block;font-size:14px}.qk span{color:var(--muted);font-size:12px}
.qk em{display:block;font-style:normal;font-size:22px;font-weight:700;margin-top:4px}
/* 分层汇总 */
.layers{display:grid;gap:10px;margin-bottom:14px}
.lrow{display:grid;grid-template-columns:90px 130px 70px 1fr 220px;gap:14px;align-items:center;padding:12px 16px;border-left:4px solid var(--c);cursor:pointer}
.lrow:hover{background:#f8faff}
.lrow .n{font-size:22px;font-weight:700}
.lrow .nm{font-weight:600}
.glos{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:14px}
.glos table{width:100%;border-collapse:collapse}
.glos td{padding:7px 4px;border-bottom:1px solid var(--line2);vertical-align:top}
.glos td:first-child{width:38%;font-family:var(--mono);font-size:12px;color:var(--sub)}
/* 表清单 split */
.split{flex:1;min-height:0;display:grid;grid-template-columns:minmax(300px,340px) minmax(0,1fr);gap:14px}
.tw:focus,.tw *:focus{outline:none}
.tl td{padding:7px 10px}
.tl .row1{display:flex;align-items:center;gap:8px}
.tl .row1 .tag{flex:none;min-width:34px;font-size:10.5px;line-height:17px}
.pane{display:flex;flex-direction:column;min-height:0;min-width:0}
.pane .tw{flex:1}
.tl-name{font-family:var(--mono);font-size:12px;word-break:break-all}
.tl-cn{color:var(--sub);font-size:12px}
.det{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.dh{padding:14px 18px 0;border-bottom:1px solid var(--line)}
.dh h2{margin:0;font-size:15px;font-family:var(--mono);word-break:break-all;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dh .cn{color:var(--sub);margin:2px 0 8px}
.tabs{display:flex;gap:2px}
.tabs a{padding:8px 14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;text-decoration:none;cursor:pointer}
.tabs a.on{color:#000;border-color:#9fcf1c;font-weight:600}
.tabs a:hover{color:var(--brand)}
.db{flex:1;min-height:0;overflow:auto;padding:12px 14px}
.db.flex{display:flex;flex-direction:column;overflow:hidden}
.kv{display:grid;grid-template-columns:96px 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:14px}
.kv>div{padding:8px 12px;border-bottom:1px solid var(--line2);white-space:pre-wrap;overflow-wrap:anywhere}
.kv>.k{background:#f6f7fa;color:var(--muted)}
.kv>div:nth-last-child(-n+2){border-bottom:0}
.links a{display:inline-block;margin:0 10px 3px 0;font-family:var(--mono);font-size:12px}
.sub{font-size:12px;color:var(--muted);margin:0 0 6px}
pre.code{margin:0;flex:1;min-height:0;overflow:auto;background:#0f1729;color:#d6e0ff;border-radius:8px;padding:14px 16px;font:12px/1.65 var(--mono);tab-size:2}
pre.code .fn{color:#c3a6ff}pre.code .vr{color:#ffb4a2}pre.code .todo{display:inline-block;min-width:100%;background:rgba(255,190,60,.13);box-shadow:inset 3px 0 0 #f3b46b}pre.code .todo.cur{background:rgba(255,190,60,.32)}
pre.code .kw{color:#9db4ff}pre.code .ty{color:#7fe0c3}pre.code .cm{color:#8f9bb8}pre.code .st{color:#f6c177}
.dtool{display:flex;gap:8px;align-items:center;margin-bottom:10px}
/* 指标卡片 */
.sep{width:1px;height:22px;background:var(--line)}
.mono-s{font-family:var(--mono);font-size:11.5px;color:var(--sub)}
.mcards{display:grid;gap:8px}
.mc{border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;background:#fff}
.mc:hover{border-color:#9fcf1c;background:#fbfdf3}
.mh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mh .grow{flex:1}
.mh b{font-size:13px}
.mk{margin:6px 0 4px;color:var(--text);line-height:1.6}
.ml{display:flex;gap:8px;font-size:12px;color:var(--muted)}
.ml span{flex:none;color:var(--muted)}
.ml code{font-family:var(--mono);color:var(--sub);overflow-wrap:anywhere}
/* 悬浮提示 */
.tip{position:fixed;z-index:50;max-width:440px;padding:10px 12px;background:#1b2027;color:#eef1f5;border-radius:8px;font-size:12.5px;line-height:1.65;box-shadow:0 8px 24px rgba(0,0,0,.22);white-space:pre-wrap;overflow-wrap:anywhere;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
.tip.show{opacity:1;transform:none}
.tip .th{display:block;font-size:11px;color:#c6ef4e;margin-bottom:4px;letter-spacing:.3px}
.tip code{font-family:var(--mono)}
/* 抽屉 */
.mask{position:fixed;inset:0;background:rgba(15,20,35,.3);z-index:20;display:none}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,94vw);background:#fff;z-index:21;transform:translateX(100%);transition:transform .2s;box-shadow:-10px 0 30px rgba(0,0,0,.14);display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer .dh2{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.drawer .dh2 h2{flex:1;margin:0;font-size:15px;line-height:1.4}
.drawer .dh2 h2 small{display:block;color:var(--muted);font-weight:400;font-family:var(--mono);font-size:12px}
.drawer .body{flex:1;overflow:auto;padding:14px 18px}
.drawer pre.code{white-space:pre-wrap;overflow-wrap:anywhere}
.formula{background:#f6f8ff;border:1px solid #dfe6ff;border-radius:8px;padding:10px 12px;margin-bottom:14px;font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;overflow-wrap:anywhere}
/* 核对报告 */
.rv-head{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) 1.6fr;gap:12px;margin-bottom:14px}
.rv-k{padding:14px 16px;border-top:3px solid var(--c)}.rv-k b{display:block;font-size:28px;line-height:1.2;color:var(--c)}.rv-k span{color:var(--sub);font-size:12px}
.rv-meta{padding:12px 16px;color:var(--sub);font-size:12px;line-height:1.8}
.fd{padding:14px 16px;margin-bottom:10px;border-left:4px solid var(--c,#98a2b3)}
.fh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.fh b{font-size:14px}.fh .grow{flex:1}
.fdd{margin:8px 0 6px;color:var(--text);line-height:1.75}
.fs{background:#f6f8f0;border-radius:6px;padding:8px 10px;color:#3d4a12;line-height:1.7}.fs span{font-weight:600;margin-right:8px}
.fmore{display:inline-block;margin-top:8px;font-size:12.5px}
.banner{display:flex;align-items:center;gap:14px;padding:12px 16px;margin-bottom:14px;border-left:4px solid #b42318;cursor:pointer}
.banner:hover{background:#fffafa}.banner b{font-size:14px}.banner .grow{flex:1}
table.st{width:100%;border-collapse:collapse;font-size:12.5px}
table.st th{background:#f5f6f9;text-align:left;font-weight:600;color:var(--sub);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.st td{padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:top;line-height:1.65}
table.st td.mono{font-family:var(--mono);font-size:12px;white-space:nowrap}
/* 时间周期方案 */
.pd{max-width:1180px}
.pd h2{font-size:17px;margin:22px 0 10px;display:flex;align-items:center;gap:8px}.pd h2:first-child{margin-top:0}
.pd h2 .no{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#000;color:#c6ef4e;font-size:12px}
.pd p{margin:0 0 10px;color:var(--sub);line-height:1.8}
.pd .lead{font-size:13.5px;color:var(--text)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.box{padding:14px 16px}.box h4{margin:0 0 6px;font-size:13.5px}.box p{margin:0;font-size:12.5px}
.box .big{font-size:26px;font-weight:700;line-height:1.2;margin:2px 0 4px}
.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;align-items:stretch;margin:4px 0 8px}
.fl{position:relative;padding:12px 14px;margin-right:22px;border-top:3px solid var(--c)}
.fl:not(:last-child)::after{content:'→';position:absolute;right:-19px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:16px}
.fl b{display:block;font-size:13px;margin-bottom:4px}.fl span{font-size:12px;color:var(--sub);line-height:1.65;display:block}
.fl.hi{background:#fbfdf3;border-color:#9fcf1c}
.side{display:flex;gap:12px;margin-top:4px}.side .box{flex:1}
.rs{display:grid;grid-template-columns:330px minmax(0,1fr);gap:14px}
.rs .ctl{padding:14px 16px;display:grid;gap:10px;align-content:start}
.rs label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.rs .sel,.rs .inp{max-width:none;min-width:0;width:100%}
.rs .out{padding:14px 16px;min-width:0}
.rng{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.rng div{border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:200px}
.rng small{display:block;color:var(--muted);font-size:11.5px}.rng b{font-family:var(--mono);font-size:13px}
.rng .cmp{border-style:dashed;flex:1}
.cal{display:flex;flex-wrap:wrap;gap:3px;margin:4px 0 12px}
.cal i{width:15px;height:15px;border-radius:3px;background:#eef0f4;display:block}
.cal i.on{background:#3a5bd9}.cal i.c{background:#f3b46b}.cal i.on.c{background:linear-gradient(135deg,#3a5bd9 50%,#f3b46b 50%)}
.cal i.h{outline:1.5px solid #d92d78;outline-offset:-1.5px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);align-items:center;flex-wrap:wrap}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:4px;vertical-align:-1px}
pre.code.sm{flex:none;max-height:none}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#3a5bd9}
.t td.c-dot{text-align:center}
@media(max-width:1100px){.rv-head{grid-template-columns:repeat(2,1fr)}.g2,.g3,.rs{grid-template-columns:1fr}.flow{grid-template-columns:1fr}.fl{margin:0 0 18px}.fl:not(:last-child)::after{content:'↓';right:auto;left:50%;top:auto;bottom:-18px;transform:none}.side{flex-direction:column}}
@media(max-width:1100px){.split{grid-template-columns:1fr}.grid5{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.quick{grid-template-columns:repeat(2,1fr)}.lrow{grid-template-columns:70px 1fr}}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" id="rail"></nav>
  <div class="main">
    <div class="top"><h1 id="ttl"></h1><div class="desc" id="dsc"></div></div>
    <div class="view" id="view"></div>
  </div>
</div>
<div class="mask" id="mask"></div>
<aside class="drawer" id="drawer"><div class="dh2"><h2 id="dt"></h2><button class="btn" id="dx">关闭 ✕</button></div><div class="body" id="dbd"></div></aside>
<script>const RAW=__DATA__;const CHK=__CHECKS__;const BMETA=__META__;const ADS=__ADS__;const ETL=__ETL__;const ORIG=__ORIG__;const CHG=ORIG.changed;</script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LAY=['ODS','DWD','DIM','DWS','ADS'];
const base=l=>String(l).replace(/（实时）/,'');
const isRT=l=>/实时/.test(l);
const shortN=n=>String(n||'').replace(/^\w+\./,'');
const ix=(k,name)=>RAW[k].cols.indexOf(name);
function hl(html,q){if(!q)return html;const re=new RegExp('('+String(q).split(/\s+/).filter(Boolean).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi');return html.replace(/(<[^>]+>)|([^<]+)/g,(m,t,x)=>t?t:x.replace(re,'<mark>$1</mark>'))}
const ltag=l=>`<span class="tag ${isRT(l)?'rt':''}" style="background:var(--${base(l)})" title="${esc(l)}">${base(l)}</span>`;

/* ---------- 数据建模 ---------- */

function parseCmt(c){c=String(c||'');let name='',kou=c,unit='';

/* ---------- DDL ---------- */
function ddl(t){
  const q=s=>String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,' ');
  const parts=t.fields.filter(f=>f.k==='分区'),cols=t.fields.filter(f=>f.k!=='分区');
  // 字段清单没登记分区字段时，按「表清单·分区」列补出 travel_date（离线 Hive 表）
  if(!parts.length&&!t.rt&&/travel_date/.test(t.part))parts.push({n:'travel_date',t:'STRING',c:'数据日期，格式 YYYYMMDD'+(/小时/.test(t.part)?'（小时子分区字段名待规范补充）':''),auto:1});
  const w=Math.max(...cols.map(f=>f.n.length),8),tw=Math.max(...cols.map(f=>String(f.t).length),6);
  const pad=(s,n)=>s+' '.repeat(Math.max(1,n-s.length+1));
  let s=`CREATE TABLE IF NOT EXISTS ${t.name} (\n`+cols.map(f=>`  ${pad(f.n,w)}${pad(String(f.t),tw)} COMMENT '${q(f.c)}'`).join(',\n')+`\n)\nCOMMENT '${q(t.cn)}'`;
  if(parts.length)s+=`\nPARTITIONED BY (\n`+parts.map(f=>`  ${f.n} ${f.t} COMMENT '${q(f.c)}'`).join(',\n')+`\n)`+(parts.some(f=>f.auto)?`\n-- 注：字段清单未登记分区字段，按表清单「分区」列补出`:'');
  else if(t.part)s+=`\n-- 分区：${t.part}`;
  s+=t.rt?`\n-- 实时表（流式写入）`:`\nSTORED AS ORC`;
  return s+';';
}
const SQLKW=/\b(INSERT OVERWRITE TABLE|INSERT INTO|CREATE MATERIALIZED VIEW IF NOT EXISTS|REFRESH ASYNC EVERY|PARTITION|SELECT|FROM|LEFT JOIN|JOIN|ON|WHERE|AND|OR|GROUP BY|ORDER BY|UNION ALL|WITH|AS|CASE|WHEN|THEN|ELSE|END|IS NOT NULL|IS NULL|NOT|NULL|DISTINCT|OVER|PARTITION BY|INTERVAL|FOR SYSTEM_TIME AS OF|TABLE|DESCRIPTOR|BETWEEN|IN|VALUES)\b/g;

/* ---------- 通用表格 ---------- */
function colClass(rows,i){
  const vals=rows.map(r=>r[i]).filter(v=>v!==''&&v!=null).slice(0,300);
  if(!vals.length)return'c-s';
  if(vals.every(v=>typeof v==='number'))return'c-n';
  const L=vals.map(v=>String(v).length).sort((a,b)=>a-b),p=L[Math.floor(L.length*.9)],mx=L[L.length-1];
  const idish=vals.filter(v=>/^[A-Za-z0-9_.\-]+$/.test(String(v))).length/vals.length>.9;
  if(idish)return mx<=14?'c-s':'c-id';
  if(p<=12)return'c-s';if(p<=26)return'c-m';if(p<=70)return'c-l';return'c-xl';
}
/* 渲染器：cfg={cols,rows,cls?,cell(i,v,q,row),onRow(row),filters:[colIdx],pageSize,wide,csvName,searchPh,extra} */
function grid(host,cfg){
  const st=cfg.state||(cfg.state={});st.q??='';st.f??={};st.sort??=null;st.page??=0;
  const cls=cfg.cols.map((_,i)=>cfg.cls?.[i]||colClass(cfg.rows,i));

    <input class="inp" id="g-q" placeholder="${esc(cfg.searchPh||'搜索…')}" value="${esc(st.q)}">
    ${fcols.map(([i,v])=>`<select class="sel ${st.f[i]?'act':''}" data-i="${i}"><option value="">${esc(cfg.cols[i])}：全部</option>${v.map(x=>`<option ${st.f[i]==x?'selected':''}>${esc(x)}</option>`).join('')}</select>`).join('')}
    <button class="btn" id="g-r">重置</button><span class="grow"></span><span class="cnt" id="g-c"></span><button class="btn" id="g-csv">导出 CSV</button></div>
    ${cfg.extra||''}<div class="card tw"><table class="t ${cfg.wide?'wide':''}"><thead><tr>${cfg.cols.map((c,i)=>`<th data-i="${i}" class="${cls[i]==='c-n'?'c-n':''}">${esc(c)}<span class="ar"></span></th>`).join('')}</tr></thead><tbody></tbody></table></div><div class="pager"></div>`;
  const PS=cfg.pageSize||100;let rows=[];
  const tb=host.querySelector('tbody'),tw=host.querySelector('.tw');
  function draw(){
    const qs=st.q.toLowerCase().split(/\s+/).filter(Boolean);
    rows=cfg.rows.filter(r=>Object.entries(st.f).every(([i,v])=>!v||String(r[i])===v)&&(!qs.length||qs.every(q=>r.some(v=>String(v).toLowerCase().includes(q)))));
    if(st.sort){const[i,d]=st.sort;rows=rows.slice().sort((a,b)=>{const x=a[i],y=b[i];return(typeof x==='number'&&typeof y==='number'?x-y:String(x).localeCompare(String(y),'zh'))*d})}

    host.querySelector('#g-c').textContent=`${rows.length} / ${cfg.rows.length} 行`;
    host.querySelector('.pager').innerHTML=pages>1?`<button class="btn" id="pp" ${st.page?'':'disabled'}>上一页</button><span>第 <b>${st.page+1}</b> / ${pages} 页 · 每页 ${PS} 行</span><button class="btn" id="np" ${st.page<pages-1?'':'disabled'}>下一页</button>`:'';

  host.querySelectorAll('th').forEach(th=>th.onclick=()=>{const i=+th.dataset.i;st.sort=st.sort&&st.sort[0]===i?(st.sort[1]>0?[i,-1]:null):[i,1];draw()});

const HOL={2024:[['元旦','new_year','2024-01-01','2024-01-01'],['春节','spring_festival','2024-02-10','2024-02-17'],['清明节','qingming','2024-04-04','2024-04-06'],['劳动节','labour_day','2024-05-01','2024-05-05'],['端午节','dragon_boat','2024-06-08','2024-06-10'],['中秋节','mid_autumn','2024-09-15','2024-09-17'],['国庆节','national_day','2024-10-01','2024-10-07']],
 2025:[['元旦','new_year','2025-01-01','2025-01-01'],['春节','spring_festival','2025-01-28','2025-02-04'],['清明节','qingming','2025-04-04','2025-04-06'],['劳动节','labour_day','2025-05-01','2025-05-05'],['端午节','dragon_boat','2025-05-31','2025-06-02'],['国庆节·中秋节','national_day','2025-10-01','2025-10-08']],
 2026:[['元旦','new_year','2026-01-01','2026-01-03'],['春节','spring_festival','2026-02-15','2026-02-23'],['清明节','qingming','2026-04-04','2026-04-06'],['劳动节','labour_day','2026-05-01','2026-05-05'],['端午节','dragon_boat','2026-06-19','2026-06-21'],['中秋节','mid_autumn','2026-09-25','2026-09-27'],['国庆节','national_day','2026-10-01','2026-10-07']]};
const dP=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const dF=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const dN=d=>dF(d).replace(/-/g,'');
const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const days=(a,b)=>Math.round((b-a)/864e5)+1;
const addY=(d,n)=>{const x=new Date(d.getFullYear()+n,d.getMonth(),1);x.setDate(Math.min(d.getDate(),new Date(x.getFullYear(),x.getMonth()+1,0).getDate()));return x};
function periodStart(d,u){const y=d.getFullYear(),m=d.getMonth();
  if(u==='week'){const w=(d.getDay()+6)%7;return add(d,-w)}
  if(u==='month')return new Date(y,m,1);if(u==='quarter')return new Date(y,m-m%3,1);if(u==='half')return new Date(y,m<6?0:6,1);return new Date(y,0,1)}
function periodShift(s,u,n){if(u==='week')return add(s,7*n);const k={month:1,quarter:3,half:6,year:12}[u];return new Date(s.getFullYear(),s.getMonth()+k*n,1)}
const UL={week:'周',month:'月',quarter:'季度',half:'半年',year:'年'};
function resolve(p){
  const anc=dP(p.anchor);let s,e,label,hol=null;
  if(p.kind==='day'){s=e=anc;label='当日'}
  else if(p.kind==='lastN'){e=anc;s=add(anc,-(p.n-1));label=`近${p.n}日（含截止日）`}
  else if(p.kind==='nat'){s=periodStart(anc,p.unit);if(p.off)s=periodShift(s,p.unit,-p.off);e=add(periodShift(s,p.unit,1),-1);label=(p.off?'上':'本')+UL[p.unit]+'（完整自然'+UL[p.unit]+'）'}
  else if(p.kind==='todate'){s=periodStart(anc,p.unit);e=anc;label=`本${UL[p.unit]}至今（${({week:'WTD',month:'MTD',quarter:'QTD',half:'HTD',year:'YTD'})[p.unit]}）`}
  else if(p.kind==='holiday'){hol=(HOL[p.year]||[]).find(h=>h[1]===p.hol)||(HOL[p.year]||[])[0];s=dP(hol[2]);e=dP(hol[3]);label=`${p.year} ${hol[0]}（${hol[1]}）`}
  else{s=dP(p.s);e=dP(p.e);if(e<s)[s,e]=[e,s];label='自定义区间'}
  const n=days(s,e);let c=null,cl='';
  if(p.cmp==='mom'){if(p.kind==='nat'){c=[periodShift(s,p.unit,-1),add(s,-1)];cl='环比：上一个自然'+UL[p.unit]}
    else if(p.kind==='todate'){const ps=periodShift(s,p.unit,-1),pe=add(ps,n-1),lim=add(s,-1);c=[ps,pe>lim?lim:pe];cl='环比：上一'+UL[p.unit]+'同期（相同天数）'}
    else{c=[add(s,-n),add(s,-1)];cl=`环比：前 ${n} 天`}}

function ratioExpr(m){

    return snap||role==='wow'?`a.travel_date = ${P[1]}`:`a.travel_date BETWEEN ${P[0]} AND ${P[1]}`}
  const P={cur:[r.s,r.e],prev:[r.ps,r.pe],ly:[r.ls,r.le],wow:[r.w,r.w]}[role];
  return snap||role==='wow'?`a.travel_date = '${P[1]}'`:`a.travel_date BETWEEN '${P[0]}' AND '${P[1]}'`;

   MOM:`(${v('cur')} - ${v('prev')}) * 100 / NULLIF(${v('prev')}, 0)`,MOMD:`${v('cur')} - ${v('prev')}`,
   YOY:`(${v('cur')} - ${v('ly')}) * 100 / NULLIF(${v('ly')}, 0)`,YOYD:`${v('cur')} - ${v('ly')}`,
   WOW:`(${v('cur')} - ${v('wow')}) * 100 / NULLIF(${v('wow')}, 0)`,WOWD:`${v('cur')} - ${v('wow')}`,
   SHR:`${v('cur')} * 100 / NULLIF(${v('base')}, 0)`}[d];}

    if(ds.includes('AVG')&&c.kind==='snapshot')inner.push(`    ${aggx(c,'cur',r,1)} AS ${pre}cur_sum,`);
    ds.forEach(d=>{const f=ADS.fields.find(x=>x.m===c.mcode&&x.d===d);outer.push(`  ${outerExpr(c,d,x=>pre+x)} AS ${f.f},`)})});
  return `-- ${t}：ADS 日数据关联时间表，按「${PN[p]}」汇总，并算出日均 / 上期 / 去年同期 / 环比 / 同比\n-- 换周期只改 period_type_code；节假日加 holiday_period_code；自定义区间把 p.* 换成前端传入的起止日\n-- 展示前 ${cs.length} 个基础指标，其余写法相同\nSELECT\n  start_date, end_date${keys.map(k=>`, ${k}`).join('')},\n${outer.join('\n').replace(/,$/,'')}\nFROM (\n  SELECT\n    p.start_date, p.end_date, MAX(p.period_day_qty) AS period_day_qty${keys.map(k=>`, a.${k}`).join('')},\n${inner.join('\n').replace(/,$/,'')}\n  FROM ads.${t} a\n  JOIN dim.dim_opr_period_f p\n    ON p.anchor_date_no = '\${T}'\n   AND p.period_type_code = '${p}'${p==='HOL'?`\n   AND p.holiday_period_code = '\${holiday_period_code}'`:''}\n   AND a.travel_date BETWEEN p.scan_start_date_no AND p.end_date_no   -- 只扫本期、上期、去年同期覆盖的分区\n  GROUP BY p.start_date, p.end_date${keys.map(k=>`, a.${k}`).join('')}\n) x;\n\n-- 按月看趋势（也可按周/季/半年/年、节假日、周末分组）：关联日期表 dim_opr_date_f\nSELECT d.month_start_date,\n${cs.slice(0,3).map(c=>`  ${c.expr.v.replace(/\{C\}/g,'a.')} AS ${c.stem}_${c.kw}`).join(',\n')}\nFROM ads.${t} a\nJOIN dim.dim_opr_date_f d ON d.date_no = a.travel_date\nWHERE a.travel_date BETWEEN '\${start_date}' AND '\${end_date}'\n  -- AND d.holiday_type = 2     -- 只看法定节假日\n  -- AND d.vacation_type = 2    -- 只看暑假\nGROUP BY d.month_start_date\nORDER BY d.month_start_date;`;
}
function exampleMatrix(t,stem){
  const c=ADS.combos.find(x=>x.t===t&&x.stem===stem);if(!c)return'';
  const fs=ADS.fields.filter(f=>f.m===c.mcode),ps=ADS.periods.map(p=>p[0]);
  return `<p>ADS 里只有一个日字段 <code class="mono-s">${esc(c.store.join('、'))}</code>（原来是 ${esc(c.old_fields.join('、'))} 共 ${c.old_fields.length} 列）。查询时关联时间表，得到下面 ${fs.reduce((a,f)=>a+f.pers.length,0)} 个业务指标：</p>
  <div style="overflow:auto" class="card"><table class="st"><thead><tr><th>查询列</th><th>派生方式</th>${ps.map(p=>`<th style="text-align:center">${esc(PN[p])}</th>`).join('')}</tr></thead><tbody>${fs.map(f=>`<tr><td class="mono">${esc(f.f)}</td><td style="white-space:nowrap">${esc(DN[f.d][1])}</td>${ps.map(p=>`<td style="text-align:center">${f.pers.includes(p)?'<span class="dot"></span>':''}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
  <p style="margin-top:8px">例：「近半年支付金额（GMV）同比增长率」= 关联时间表 <code class="mono-s">period_type_code='N180'</code>，(本期 SUM(pay_amt) − 去年同期 SUM(pay_amt)) × 100 ÷ 去年同期。</p>`;
}
function baseDrawer(c){
  const fs=ADS.fields.filter(f=>f.m===c.mcode),ps=ADS.periods.map(p=>p[0]);
  drawer(c.base_cn,`${c.mcode} · ${c.t}`,kvHtml([['ADS 表',linksHtml(c.t)],['口径',esc(c.code)],['修饰词',esc(c.mod)],['聚合方式',kindPill(c.kind)],['单位',esc(c.unit)],['ADS 日字段',`<span class="c-id">${esc(c.store.join('、'))}</span>`],['区间汇总',`<span class="c-id">${esc(c.expr.v.replace(/\{C\}/g,''))}</span>${c.expr.snap?'（取区间末日）':''}`],['合并的原字段',`<span class="mono-s">${esc(c.old_fields.join('、'))}</span>`],['业务口径',esc(c.kou)],['口径公式',esc(c.calc)]])+
   `<div class="sub">可查询指标 × 统计周期（${fs.reduce((a,f)=>a+f.pers.length,0)} 个业务指标）</div><div style="overflow:auto"><table class="st"><thead><tr><th>查询列</th><th>派生</th>${ps.map(p=>`<th style="text-align:center;font-size:11px">${esc(PN[p])}</th>`).join('')}</tr></thead><tbody>${fs.map(f=>`<tr><td class="mono">${esc(f.f)}</td><td style="white-space:nowrap">${esc(DN[f.d][1])}</td>${ps.map(p=>`<td style="text-align:center">${f.pers.includes(p)?'<span class="dot"></span>':''}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);
}

// 自定义悬浮提示：仅当内容被截断时显示
(()=>{const tip=document.createElement('div');tip.className='tip';document.body.appendChild(tip);let cur=null,tm=null;
 const hide=()=>{clearTimeout(tm);tip.classList.remove('show');cur=null};
 document.addEventListener('mouseover',e=>{const el=e.target.closest('.cl');if(el===cur)return;hide();if(!el)return;
  if(el.scrollHeight<=el.clientHeight+1&&el.scrollWidth<=el.clientWidth+1)return;
  cur=el;tm=setTimeout(()=>{const td=el.closest('td'),table=el.closest('table');const th=table&&td?table.querySelectorAll('thead th')[td.cellIndex]:null;
   tip.innerHTML=(th?`<span class="th">${esc(th.textContent.replace(/[▲▼]/g,'').trim())}</span>`:'')+esc(el.textContent);
   const r=el.getBoundingClientRect();tip.style.left='0px';tip.style.top='0px';tip.classList.add('show');
   const w=tip.offsetWidth,h=tip.offsetHeight;let x=Math.min(r.left-12,innerWidth-w-12);x=Math.max(12,x);let y=r.bottom+6;if(y+h>innerHeight-12)y=r.top-h-6;
   tip.style.left=x+'px';tip.style.top=y+'px'},250)});
 document.addEventListener('scroll',hide,true);document.addEventListener('mousedown',hide);})();
route();
</script>
