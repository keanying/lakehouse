<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>业务库 DDL 补齐</title>
<style>
/* 工作台布局：顶栏（进度 + 文件 + 批量粘贴）｜左侧表清单（状态筛选、多选批量弃用）｜右侧单表（字段比对 / 编辑 DDL / 弃用标记） */
:root {
  --bg: #eef1f5; --panel: #ffffff; --raised: #f7f9fb; --ink: #16202e; --muted: #5f6c7d; --faint: #8b96a5; --line: #dfe4ea; --line2: #eceff3;
  --brand: #2364c8; --brand-ink: #ffffff; --brand-soft: #e6eefb; --focus: rgba(35, 100, 200, .28);
  --ok: #157347; --ok-bg: #e5f4eb; --warn: #9a5a00; --warn-bg: #fdf0d8; --bad: #b3261e; --bad-bg: #fbe7e5; --dep: #5b6472; --dep-bg: #eceef1;
  --sans: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --shadow: 0 8px 28px rgba(16, 28, 45, .14); --mark: #ffe9a8;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #0d1218; --panel: #151c25; --raised: #1a2230; --ink: #e5eaf1; --muted: #9aa6b6; --faint: #6f7b8b; --line: #283342; --line2: #212b38;
  --brand: #4d8ee8; --brand-ink: #0b1220; --brand-soft: #18273d; --focus: rgba(77, 142, 232, .35);
  --ok: #4cc283; --ok-bg: #132a1e; --warn: #f0b34a; --warn-bg: #33270f; --bad: #f2776d; --bad-bg: #371917; --dep: #a3acb8; --dep-bg: #232b36;
  --shadow: 0 8px 28px rgba(0, 0, 0, .45); --mark: #5a4710; color-scheme: dark } }
* { box-sizing: border-box }
html, body { height: 100% }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.55 var(--sans); display: flex; flex-direction: column; -webkit-font-smoothing: antialiased }
button, input, select, textarea { font: inherit; color: inherit }
code, .mono { font-family: var(--mono); font-size: .92em }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px }

/* 顶栏 */
.top { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--line) }
.brand { display: flex; align-items: baseline; gap: 10px }
.brand h1 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: .01em }
.brand span { color: var(--faint); font-size: 12px }
.prog { display: grid; gap: 4px; min-width: 260px; flex: 1; max-width: 640px }
.prog .track { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--line2) }
.prog .track i { display: block; height: 100% }
.prog .track i + i { margin-left: 2px }
.prog .lg { display: flex; gap: 4px 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; font-variant-numeric: tabular-nums }
.prog .lg span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; background: var(--c) }
.prog .lg b { color: var(--ink); font-weight: 600 }
.file { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); min-width: 0; margin-left: auto }
.file code { background: var(--raised); border: 1px solid var(--line2); padding: 2px 8px; border-radius: 5px; max-width: 34vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px }
.sv { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap }
.sv::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ok) }
.sv.busy::before { background: var(--warn) } .sv.err { color: var(--bad) } .sv.err::before { background: var(--bad) }

/* 按钮 / 输入 */
.btn { height: 32px; padding: 0 13px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px }
.btn:hover { border-color: var(--brand); color: var(--brand) }
.btn.pri { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); font-weight: 500 }
.btn.pri:hover { filter: brightness(1.08); color: var(--brand-ink) }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted) }
.btn.ghost:hover { background: var(--raised); color: var(--ink) }
.btn.dep:hover { border-color: var(--dep); color: var(--dep) }
.btn.danger:hover { border-color: var(--bad); color: var(--bad) }
.btn:disabled { opacity: .45; cursor: default; pointer-events: none }
.btn.sm { height: 28px; padding: 0 10px; font-size: 13px }
.inp, .sel { height: 32px; border: 1px solid var(--line); border-radius: 7px; padding: 0 10px; background: var(--panel); outline: none; width: 100% }
.inp:focus, .sel:focus, textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--focus) }
textarea { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font: 12.5px/1.6 var(--mono); background: var(--panel); resize: vertical; outline: none; tab-size: 2 }
kbd { font: 11px var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--muted); background: var(--raised) }

/* 状态标签 */
.tag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 11px; font-size: 12px; white-space: nowrap; background: var(--raised); color: var(--muted); border: 1px solid var(--line2) }
.tag.ok { background: var(--ok-bg); color: var(--ok); border-color: transparent }
.tag.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent }
.tag.bad { background: var(--bad-bg); color: var(--bad); border-color: transparent }
.tag.dep { background: var(--dep-bg); color: var(--dep); border-color: transparent }

/* 主体 */
main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(320px, 400px) 1fr }
aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0 }
.flt { padding: 12px 14px 10px; display: grid; gap: 9px; border-bottom: 1px solid var(--line) }
.flt .r2 { display: grid; grid-template-columns: 1fr auto; gap: 8px }
.chips { display: flex; gap: 6px; flex-wrap: wrap }
.chip { height: 26px; padding: 0 10px; border: 1px solid var(--line); border-radius: 13px; background: var(--panel); color: var(--muted); font-size: 12.5px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px }
.chip i { font-style: normal; font-variant-numeric: tabular-nums; color: var(--faint) }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--panel) }
.chip[aria-pressed="true"] i { color: inherit; opacity: .7 }
.list { flex: 1; overflow: auto; outline: none }
.it { display: grid; grid-template-columns: 1fr auto; gap: 1px 10px; align-items: center; padding: 9px 14px 9px 12px; border-bottom: 1px solid var(--line2); cursor: pointer; border-left: 3px solid transparent }
.it:hover { background: var(--raised) }
.it.on { background: var(--brand-soft); border-left-color: var(--brand) }
.it .ck { grid-row: span 2; width: 16px; height: 16px; margin: 0; accent-color: var(--brand); display: none }
.multi .it { grid-template-columns: auto 1fr auto }
.multi .it .ck { display: block }
.multi .it .cn { grid-column: 2 }
.it .nm { font: 12.5px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0 }
.it .nm em { font-style: normal; color: var(--faint) }
.it .cn { grid-column: 1; font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0 }
.it .st { grid-row: span 2; display: grid; justify-items: end; gap: 2px; font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums }
.it.dep .nm { text-decoration: line-through; text-decoration-color: var(--faint); color: var(--muted) }
mark { background: var(--mark); color: var(--ink); border-radius: 2px; padding: 0 1px }
.selbar { display: none; align-items: center; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); background: var(--raised); font-size: 13px; flex-wrap: wrap }
.multi .selbar { display: flex }
.selbar b { font-variant-numeric: tabular-nums }

/* 右侧 */
.right { overflow: auto; padding: 18px 24px 48px; min-width: 0 }
.empty { color: var(--muted); text-align: center; padding: 70px 20px; display: grid; gap: 10px; justify-items: center }
.empty .big { font-size: 15px; color: var(--ink); font-weight: 600 }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; min-width: 0 }
.dh { display: flex; align-items: flex-start; gap: 12px; padding: 16px 20px 12px; flex-wrap: wrap }
.dh .tt { min-width: 0; flex: 1 }
.dh .nm { font: 600 16px var(--mono); word-break: break-all }
.dh .sub { color: var(--muted); font-size: 13px; margin-top: 2px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center }
.dh .act { display: flex; gap: 6px; flex-wrap: wrap }
.depbox { margin: 0 20px 12px; padding: 10px 14px; border-radius: 8px; background: var(--dep-bg); color: var(--ink); font-size: 13px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap }
.depbox b { color: var(--dep) }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); border-top: 1px solid var(--line2); border-bottom: 1px solid var(--line2) }
.stats > div { padding: 10px 20px; border-right: 1px solid var(--line2) }
.stats > div:last-child { border-right: 0 }
.stats .v { font-size: 18px; font-weight: 650; font-variant-numeric: tabular-nums }
.stats .l { font-size: 12px; color: var(--muted) }
.stats .v.warn { color: var(--warn) } .stats .v.bad { color: var(--bad) }
.tabs { display: flex; gap: 2px; padding: 10px 20px 0; border-bottom: 1px solid var(--line2) }
.tab { border: 0; background: transparent; padding: 8px 12px; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--brand); font-weight: 600 }
.pane { padding: 14px 20px 18px }
.bar2 { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap }
.tw { border: 1px solid var(--line2); border-radius: 8px; overflow: auto; max-height: calc(100vh - 360px); min-height: 160px }
table { border-collapse: collapse; width: 100%; font-size: 12.5px }
th, td { padding: 7px 12px; border-bottom: 1px solid var(--line2); text-align: left; vertical-align: top }
th { position: sticky; top: 0; background: var(--raised); color: var(--muted); font-weight: 500; z-index: 1; white-space: nowrap }
td.m { font-family: var(--mono); white-space: nowrap }
tr.add td:first-child { box-shadow: inset 3px 0 var(--warn) } tr.miss td:first-child { box-shadow: inset 3px 0 var(--bad) }
.hint { font-size: 12.5px; margin: 8px 0 0; min-height: 20px; color: var(--muted) }
.hint.ok { color: var(--ok) } .hint.bad { color: var(--bad) } .hint.warn { color: var(--warn) }
.foot { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap }
.foot .grow { flex: 1 }
.synced { font-size: 12.5px; color: var(--muted); margin-top: 12px; line-height: 1.8 }
.synced code { background: var(--raised); border-radius: 4px; padding: 0 4px; margin-right: 2px }

/* 弹窗 */
dialog { border: 1px solid var(--line); border-radius: 14px; padding: 0; background: var(--panel); color: var(--ink); box-shadow: var(--shadow); width: min(980px, calc(100vw - 32px)); max-height: calc(100vh - 48px) }
dialog.small { width: min(480px, calc(100vw - 32px)) }
dialog::backdrop { background: rgba(10, 16, 26, .45) }
.dlg { display: flex; flex-direction: column; max-height: calc(100vh - 50px) }
.dlg header { padding: 16px 20px 10px; display: flex; align-items: baseline; gap: 10px }
.dlg header h2 { margin: 0; font-size: 16px }
.dlg header p { margin: 0; color: var(--muted); font-size: 12.5px }
.dlg .body { padding: 4px 20px 14px; overflow: auto; display: grid; gap: 12px }
.dlg footer { padding: 12px 20px; border-top: 1px solid var(--line2); display: flex; gap: 8px; justify-content: flex-end; align-items: center; flex-wrap: wrap }
.dlg footer .grow { flex: 1; font-size: 12.5px; color: var(--muted) }
.pv td .sel { height: 28px; width: auto; min-width: 200px; font-size: 12.5px }
.radios { display: grid; gap: 6px }
.radios label { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer }
.radios label:has(input:checked) { border-color: var(--brand); background: var(--brand-soft) }
.radios input { accent-color: var(--brand) }

/* 提示 */
.toast { position: fixed; right: 20px; bottom: 20px; display: grid; gap: 8px; z-index: 50 }
.toast div { background: var(--ink); color: var(--panel); padding: 9px 14px; border-radius: 8px; box-shadow: var(--shadow); font-size: 13px; max-width: 420px }
.toast div.err { background: var(--bad); color: #fff }
@media (prefers-reduced-motion: no-preference) { .toast div { animation: tin .18s ease-out } @keyframes tin { from { transform: translateY(6px); opacity: 0 } } }
@media (max-width: 900px) { main { grid-template-columns: 1fr; grid-template-rows: 46vh 1fr } aside { border-right: 0; border-bottom: 1px solid var(--line) } .file { margin-left: 0 } .right { padding: 14px 12px 40px } }
</style>
</head>
<body>
<div class="top">
  <div class="brand"><h1>业务库 DDL 补齐</h1><span>录入即写入文件</span></div>
  <div class="prog" aria-live="polite"><div class="track" id="track"></div><div class="lg" id="legend">加载中…</div></div>
  <div class="file"><span class="sv" id="sv">已连接</span><code id="file" title="">—</code></div>
  <button class="btn pri" id="openBulk" title="快捷键 B">批量粘贴 DDL</button>
</div>

<main>
  <aside id="aside">
    <div class="flt">
      <div class="r2"><input class="inp" id="q" placeholder="搜索表名 / 中文名（/ 聚焦）" autocomplete="off" aria-label="搜索"><button class="btn sm" id="multi" aria-pressed="false" title="多选后批量标记弃用">多选</button></div>
      <div class="chips" id="chips" role="group" aria-label="按状态筛选"></div>
      <select class="sel" id="fds" aria-label="按数据源筛选"><option value="">全部数据源</option></select>
    </div>
    <div class="list" id="list" role="listbox" aria-label="业务库表" tabindex="0"></div>
    <div class="selbar"><span>已选 <b id="selN">0</b> 张</span><button class="btn sm" id="selAll">全选当前筛选</button><button class="btn sm dep" id="selDep">标记弃用</button><button class="btn sm" id="selUndep">取消弃用</button><button class="btn sm ghost" id="selClr">清除</button></div>
  </aside>
  <section class="right" id="right"></section>
</main>

<dialog id="bulkDlg"><div class="dlg">
  <header><h2>批量粘贴 DDL</h2><p>粘贴 <code>SHOW CREATE TABLE</code> 或 mysqldump 里的 <code>CREATE TABLE</code>，可一次贴多张；先预览匹配结果，再保存</p></header>
  <div class="body">
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><select class="sel" id="bds" style="width:auto;min-width:240px" aria-label="默认数据源"><option value="">数据源：按表名自动匹配</option></select><span style="font-size:12.5px;color:var(--muted)">同名表在多个数据源时，可在下方逐张选择</span></div>
    <textarea id="bulk" style="min-height:200px" placeholder="CREATE TABLE `uu_ss_order` (&#10;  `id` int(11) unsigned NOT NULL AUTO_INCREMENT COMMENT '表id',&#10;  ...&#10;) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COMMENT='平台订单记录主表';"></textarea>
    <div id="pv"></div>
  </div>
  <footer><span class="grow" id="bsum"></span><button class="btn" data-close>取消</button><button class="btn pri" id="bsave" disabled>保存</button></footer>
</div></dialog>

<dialog id="depDlg" class="small"><div class="dlg">
  <header><h2 id="depTitle">标记弃用</h2></header>
  <div class="body">
    <div class="radios" id="depReason">
      <label><input type="radio" name="r" value="业务已下线" checked>业务已下线，不再使用</label>
      <label><input type="radio" name="r" value="表已删除 / 迁移">表已删除或迁移到新表</label>
      <label><input type="radio" name="r" value="测试 / 临时表">测试或临时表</label>
      <label><input type="radio" name="r" value="其他">其他</label>
    </div>
    <input class="inp" id="depNote" placeholder="备注（选填）：如替代表名、确认人" autocomplete="off">
    <p style="margin:0;font-size:12.5px;color:var(--muted)">弃用状态写入同一个文件；数仓会据此把对应 ODS 同步标为建议下线。已录入的 DDL 保留。</p>
  </div>
  <footer><button class="btn" data-close>取消</button><button class="btn pri" id="depOk">标记弃用</button></footer>
</div></dialog>

<div class="toast" id="toast" aria-live="polite"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const now = () => { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; };
let TABLES = [], E = {}, TBY = {}, IDX = {}, SEL = null, FILTER = 'all', TAB = null, DIFFONLY = false, MULTI = false;
const PICK = new Set();

// ---------------------------------------------------------------- DDL 解析（与 dataworks/standard/src_ddl.py 同一规则）
function splitTop(s) { const r = []; let d = 0, q = null, b = 0; for (let i = 0; i < s.length; i++) { const ch = s[i]; if (q) { if (ch === '\\') { i++; continue } if (ch === q) q = null; continue }
  if (ch === "'" || ch === '"' || ch === '`') { q = ch; continue } if (ch === '(') d++; else if (ch === ')') d--; else if (ch === ',' && d === 0) { r.push(s.slice(b, i)); b = i + 1 } } r.push(s.slice(b)); return r }
function parseDDL(text) {
  const out = [], re = /CREATE\s+TABLE\s+(?:IF\s+NOT\s+EXISTS\s+)?((?:`[^`]+`|[\w$]+)(?:\s*\.\s*(?:`[^`]+`|[\w$]+))?)\s*\(/ig; let m; const st = [];
  while ((m = re.exec(text))) st.push({ i: m.index, name: m[1], body: re.lastIndex });
  st.forEach((x, k) => {
    let d = 1, j = x.body, q = null;
    for (; j < text.length && d > 0; j++) { const ch = text[j]; if (q) { if (ch === '\\') { j++; continue } if (ch === q) q = null; continue } if (ch === "'" || ch === '"' || ch === '`') q = ch; else if (ch === '(') d++; else if (ch === ')') d-- }
    const inner = text.slice(x.body, j - 1), nxt = k + 1 < st.length ? st[k + 1].i : text.length; let end = text.indexOf(';', j); if (end < 0 || end > nxt) end = nxt;
    const tail = text.slice(j, end), nm = x.name.replace(/[`\s]/g, '').split('.'); const cols = [], pk = [];
    splitTop(inner).forEach(line => { const L = line.trim(); if (!L) return;
      const p = L.match(/^PRIMARY\s+KEY\s*\(([^)]*)\)/i); if (p) { pk.push(...p[1].split(',').map(v => v.replace(/[`\s]/g, '').replace(/\(\d+\)$/, ''))); return }
      if (/^(UNIQUE|KEY|INDEX|CONSTRAINT|FULLTEXT|SPATIAL|FOREIGN|CHECK)\b/i.test(L)) return;
      const c = L.match(/^`?([^`\s]+)`?\s+(\w+(?:\s*\([^)]*\))?(?:\s+unsigned)?(?:\s+zerofill)?)([\s\S]*)$/i); if (!c) return;
      const rest = c[3], cm = rest.match(/COMMENT\s+'((?:[^'\\]|\\.|'')*)'/i);
      cols.push({ n: c[1], t: c[2].replace(/\s+/g, ' '), nn: /NOT\s+NULL/i.test(rest), c: cm ? cm[1].replace(/''/g, "'").replace(/\\'/g, "'") : '' });
      if (/PRIMARY\s+KEY/i.test(rest)) pk.push(c[1]) });
    const tc = tail.match(/COMMENT\s*=?\s*'((?:[^'\\]|\\.|'')*)'/i);
    out.push({ db: nm.length > 1 ? nm[0] : '', table: nm[nm.length - 1], cols, pk, comment: tc ? tc[1] : '', ddl: text.slice(x.i, end).trim().replace(/;?$/, ';') }) });
  return out;
}
const PC = new Map(); const parsed = s => { if (!PC.has(s)) PC.set(s, parseDDL(s)[0] || null); return PC.get(s) };

// ---------------------------------------------------------------- 匹配、比对、状态
function matchSrc(p, ds) {
  const t = p.table.toLowerCase(); let c = IDX[t] || IDX[t.replace(/_(\d+|(19|20)\d{2,6})$/, '')] || [];
  if (ds) c = c.filter(n => n.startsWith(ds + ':'));
  else if (c.length > 1 && p.db) { const f = c.filter(n => { const d = n.split(':')[0].toLowerCase(), b = p.db.toLowerCase(); return d === b || d.endsWith('_' + b) }); if (f.length) c = f }
  return c;
}
function compare(t, p) {
  const have = new Map((t.fields || []).map(f => [f.n.toLowerCase(), f])), got = new Set(p.cols.map(c => c.n.toLowerCase()));
  const rows = p.cols.map(c => ({ n: c.n, t: c.t, c: c.c, nn: c.nn, pk: p.pk.includes(c.n), st: have.has(c.n.toLowerCase()) ? 'same' : 'add' }));
  (t.fields || []).forEach(f => { if (!got.has(f.n.toLowerCase())) rows.push({ n: f.n, t: '', c: f.c, st: 'miss' }) });
  return { rows, add: rows.filter(r => r.st === 'add').length, miss: rows.filter(r => r.st === 'miss').length };
}
const tbl = k => TBY[k] || { name: k, ds: k.split(':')[0], table: k.split(':').pop(), cn: (E[k] && E[k].ddl && parsed(E[k].ddl)?.comment) || '', fields: [], un: 1 };
function state(k) {
  const e = E[k], t = tbl(k);
  if (e && e.status === '弃用') return 'dep';
  if (t.un) return 'un';
  if (!e || !e.ddl) return 'todo';
  const p = parsed(e.ddl); if (!p) return 'todo';
  const d = compare(t, p); return d.add || d.miss ? 'diff' : 'done';
}
const ST = { todo: ['未录入', ''], done: ['DDL · 一致', 'ok'], diff: ['DDL · 有差异', 'warn'], dep: ['已弃用', 'dep'], un: ['未对上', 'bad'] };
const allKeys = () => TABLES.map(t => t.name).concat(Object.keys(E).filter(k => !TBY[k]));

// ---------------------------------------------------------------- 写文件
let SAVING = 0;
async function save(set, del, okText) {
  const sv = $('#sv'); SAVING++; sv.className = 'sv busy'; sv.textContent = '保存中…';
  try {
    const r = await fetch('/api/entries', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ set: set || {}, del: del || [] }) });
    const j = await r.json(); if (!r.ok || !j.ok) throw new Error(j.error || ('HTTP ' + r.status));
    E = j.entries; sv.className = 'sv'; sv.textContent = '已写入 ' + j.saved_at.slice(11); if (okText) toast(okText); return true;
  } catch (e) { sv.className = 'sv err'; sv.textContent = '写入失败'; toast('写入失败：' + e.message + '。检查工具窗口是否还开着', 1); return false; }
  finally { SAVING--; }
}
function toast(t, err) { const d = document.createElement('div'); d.textContent = t; if (err) d.className = 'err'; $('#toast').appendChild(d); setTimeout(() => d.remove(), err ? 6000 : 2600); }

// ---------------------------------------------------------------- 顶栏进度
function renderProgress() {
  const c = { done: 0, diff: 0, dep: 0, todo: 0 }; TABLES.forEach(t => c[state(t.name)]++);
  const N = TABLES.length || 1, seg = [['done', 'var(--ok)', 'DDL 一致'], ['diff', 'var(--warn)', 'DDL 有差异'], ['dep', 'var(--dep)', '已弃用']];
  $('#track').innerHTML = seg.filter(([k]) => c[k]).map(([k, col]) => `<i style="width:${c[k] * 100 / N}%;background:${col}"></i>`).join('');
  $('#legend').innerHTML = `<em style="font-style:normal">已处理 <b>${c.done + c.diff + c.dep}</b> / ${TABLES.length}</em>` + seg.map(([k, col, l]) => `<span style="--c:${col}">${l} <b>${c[k]}</b></span>`).join('') + `<span style="--c:var(--line)">未处理 <b>${c.todo}</b></span>`;
}

// ---------------------------------------------------------------- 左侧清单
const CH = [['all', '全部'], ['todo', '未录入'], ['diff', '有差异'], ['done', '一致'], ['dep', '已弃用'], ['un', '未对上']];
let VIEW = [];
function hl(s, q) { s = esc(s); if (!q) return s; const i = s.toLowerCase().indexOf(esc(q).toLowerCase()); return i < 0 ? s : s.slice(0, i) + '<mark>' + s.slice(i, i + esc(q).length) + '</mark>' + s.slice(i + esc(q).length) }
function renderList(keepScroll) {
  const q = $('#q').value.trim(), ql = q.toLowerCase(), ds = $('#fds').value, keys = allKeys(), cnt = { all: keys.length };
  keys.forEach(k => { const s = state(k); cnt[s] = (cnt[s] || 0) + 1 });
  $('#chips').innerHTML = CH.filter(([k]) => k === 'all' || cnt[k] || k === FILTER).map(([k, l]) => `<button class="chip" data-f="${k}" aria-pressed="${FILTER === k}">${l}<i>${cnt[k] || 0}</i></button>`).join('');
  VIEW = keys.filter(k => { const t = tbl(k); return (FILTER === 'all' || state(k) === FILTER) && (!ds || t.ds === ds) && (!ql || k.toLowerCase().includes(ql) || String(t.cn).toLowerCase().includes(ql)) });
  const L = $('#list'), top = L.scrollTop;
  L.innerHTML = VIEW.length ? VIEW.slice(0, 800).map(k => {
    const t = tbl(k), s = state(k), [ds0, tb] = [t.ds, t.table];
    return `<div class="it ${SEL === k ? 'on' : ''} ${s === 'dep' ? 'dep' : ''}" data-k="${esc(k)}" role="option" aria-selected="${SEL === k}">
      <input type="checkbox" class="ck" tabindex="-1" ${PICK.has(k) ? 'checked' : ''} aria-label="选择 ${esc(k)}">
      <span class="nm" title="${esc(k)}"><em>${hl(ds0, q)}:</em>${hl(tb, q)}</span>
      <span class="st"><span class="tag ${ST[s][1]}">${ST[s][0]}</span>${t.un ? '' : (t.fields.length + ' 列')}</span>
      <span class="cn">${hl(t.cn || '—', q)}</span></div>` }).join('') : '<div class="empty"><div>没有符合条件的表</div></div>';
  if (keepScroll) L.scrollTop = top;
  $('#selN').textContent = PICK.size; renderProgress();
}
$('#chips').onclick = e => { const b = e.target.closest('.chip'); if (b) { FILTER = b.dataset.f; renderList() } };
$('#q').oninput = () => renderList(); $('#fds').onchange = () => renderList();
$('#list').onclick = e => {
  const it = e.target.closest('.it'); if (!it) return; const k = it.dataset.k;
  if (MULTI) { PICK.has(k) ? PICK.delete(k) : PICK.add(k); renderList(true); return }
  select(k);
};
function select(k, scroll) {
  SEL = k; TAB = null; renderList(true); renderDetail();
  if (scroll) { const el = [...document.querySelectorAll('.it')].find(x => x.dataset.k === k); el && el.scrollIntoView({ block: 'nearest' }) }
}
$('#list').onkeydown = e => {
  if (!['ArrowDown', 'ArrowUp', 'j', 'k'].includes(e.key)) return; e.preventDefault();
  const i = VIEW.indexOf(SEL), n = (e.key === 'ArrowDown' || e.key === 'j') ? Math.min(VIEW.length - 1, i + 1) : Math.max(0, i - 1);
  if (VIEW[n]) select(VIEW[n], 1);
};
$('#multi').onclick = () => { MULTI = !MULTI; $('#multi').setAttribute('aria-pressed', MULTI); $('#multi').textContent = MULTI ? '退出多选' : '多选'; $('#aside').classList.toggle('multi', MULTI); if (!MULTI) PICK.clear(); renderList(true) };
$('#selAll').onclick = () => { VIEW.forEach(k => PICK.add(k)); renderList(true) };

$('#selDep').onclick = () => { if (PICK.size) openDep([...PICK]) };
$('#selUndep').onclick = async () => { if (PICK.size && await undep([...PICK])) { PICK.clear(); renderList(true); renderDetail() } };

// ---------------------------------------------------------------- 弃用
let DEPKEYS = [];
function openDep(keys) {
  DEPKEYS = keys; const e = keys.length === 1 ? E[keys[0]] : null;
  $('#depTitle').textContent = keys.length === 1 ? `标记弃用：${keys[0]}` : `标记弃用：${keys.length} 张表`;
  const r = e && e.reason ? [...document.querySelectorAll('#depReason input')].find(x => x.value === e.reason) : null;
  (r || document.querySelector('#depReason input')).checked = true; $('#depNote').value = (e && e.note) || '';
  $('#depOk').textContent = keys.length === 1 && e && e.status === '弃用' ? '更新' : '标记弃用'; $('#depDlg').showModal();
}
$('#depOk').onclick = async () => {
  const reason = document.querySelector('#depReason input:checked').value, note = $('#depNote').value.trim(), at = now(), set = {};
  DEPKEYS.forEach(k => { set[k] = { ...(E[k] || {}), status: '弃用', reason, note, at } });
  if (await save(set, null, `已标记弃用 ${DEPKEYS.length} 张`)) { $('#depDlg').close(); PICK.clear(); renderList(true); renderDetail() }
};
async function undep(keys) {
  const set = {}; keys.forEach(k => { if (E[k]) { const { status, reason, note, ...rest } = E[k]; set[k] = { ...rest, at: now() } } });
  return Object.keys(set).length ? save(set, null, `已取消弃用 ${Object.keys(set).length} 张`) : true;
}

// ---------------------------------------------------------------- 右侧详情
function nextTodo(from) { const ks = VIEW.length ? VIEW : allKeys(), i = ks.indexOf(from); for (let j = 1; j <= ks.length; j++) { const k = ks[(i + j) % ks.length]; if (state(k) === 'todo') return k } return null }
function renderDetail() {
  const R = $('#right');
  if (!SEL) {
    R.innerHTML = `<div class="empty"><div class="big">从左侧选一张表开始</div><div>查看字段比对、粘贴或修改 DDL，或把不再使用的表标记为弃用</div>
      <div style="font-size:12.5px">快捷键：<kbd>/</kbd> 搜索 · <kbd>↑</kbd><kbd>↓</kbd> 切换表 · <kbd>B</kbd> 批量粘贴 · <kbd>Ctrl</kbd>+<kbd>S</kbd> 保存</div>
      <button class="btn pri" id="goNext" style="margin-top:6px">从第一张未录入的表开始</button></div>`;
    $('#goNext').onclick = () => { const k = nextTodo(null); if (k) select(k, 1) }; return;
  }
  const k = SEL, t = tbl(k), e = E[k] || {}, p = e.ddl ? parsed(e.ddl) : null, d = p ? compare(t, p) : null, s = state(k);
  TAB = TAB || (p ? 'cmp' : 'edit');
  R.innerHTML = `<div class="card">
    <div class="dh"><div class="tt"><div class="nm">${esc(k)}</div><div class="sub"><span>${esc(t.cn || (p && p.comment) || '未命名')}</span><span class="tag ${ST[s][1]}">${ST[s][0]}</span>${e.at ? `<span>更新于 ${esc(e.at)}</span>` : ''}</div></div>
      <div class="act">${s === 'dep' ? '<button class="btn sm" id="undep">取消弃用</button>' : '<button class="btn sm dep" id="dep">标记弃用</button>'}<button class="btn sm ghost" id="nx" title="下一张未录入">下一张未录入 →</button></div></div>
    ${s === 'dep' ? `<div class="depbox"><b>已弃用</b><span>${esc(e.reason || '')}${e.note ? ' · ' + esc(e.note) : ''}</span><button class="btn sm ghost" id="depEdit">修改</button></div>` : ''}
    ${t.un ? '<div class="depbox" style="background:var(--bad-bg)"><b style="color:var(--bad)">未对上</b><span>这张表不在同步任务读取的业务库表里，DDL 已保存；如是新表或改名，数仓会人工处理</span></div>' : ''}
    <div class="stats">
      <div><div class="v">${p ? p.cols.length : '—'}</div><div class="l">DDL 字段</div></div>
      <div><div class="v">${t.un ? '—' : t.fields.length}</div><div class="l">同步配置字段</div></div>
      <div><div class="v ${d && d.add ? 'warn' : ''}">${d ? d.add : '—'}</div><div class="l">DDL 有、未同步</div></div>
      <div><div class="v ${d && d.miss ? 'bad' : ''}">${d ? d.miss : '—'}</div><div class="l">同步有、DDL 无</div></div>
      <div><div class="v" style="font-size:14px;padding-top:3px">${p ? esc(p.pk.join('、') || '无') : '—'}</div><div class="l">主键</div></div>
    </div>
    <div class="tabs" role="tablist"><button class="tab" role="tab" data-t="cmp" aria-selected="${TAB === 'cmp'}" ${p ? '' : 'disabled'}>字段比对</button><button class="tab" role="tab" data-t="edit" aria-selected="${TAB === 'edit'}">${p ? '编辑 DDL' : '录入 DDL'}</button></div>
    <div class="pane" id="pane"></div></div>`;
  R.querySelector('.tabs').onclick = ev => { const b = ev.target.closest('.tab'); if (b && !b.disabled) { TAB = b.dataset.t; renderDetail() } };
  const dep = $('#dep'); if (dep) dep.onclick = () => openDep([k]);
  const ud = $('#undep'); if (ud) ud.onclick = async () => { if (await undep([k])) { renderList(true); renderDetail() } };
  const de = $('#depEdit'); if (de) de.onclick = () => openDep([k]);
  $('#nx').onclick = () => { const n = nextTodo(k); n ? select(n, 1) : toast('当前筛选下没有未录入的表了') };
  const P = $('#pane');
  if (TAB === 'cmp' && p) {
    const rows = d.rows.filter(r => !DIFFONLY || r.st !== 'same');
    P.innerHTML = `<div class="bar2"><div class="chips"><button class="chip" data-d="0" aria-pressed="${!DIFFONLY}">全部字段<i>${d.rows.length}</i></button><button class="chip" data-d="1" aria-pressed="${DIFFONLY}">只看差异<i>${d.add + d.miss}</i></button></div>
      <span style="font-size:12.5px;color:var(--muted)">表注释：${esc(p.comment || '—')}</span></div>
      <div class="tw"><table><thead><tr><th>#</th><th>字段</th><th>DDL 类型</th><th>非空</th><th>注释</th><th>比对</th></tr></thead><tbody>${rows.length ? rows.map((r, i) => `<tr class="${r.st}"><td style="color:var(--faint)">${i + 1}</td><td class="m">${esc(r.n)}${r.pk ? ' <span class="tag">主键</span>' : ''}</td><td class="m">${esc(r.t || '—')}</td><td>${r.st === 'miss' ? '—' : r.nn ? '是' : ''}</td><td>${esc(r.c)}</td><td>${r.st === 'same' ? '<span class="tag ok">一致</span>' : r.st === 'add' ? '<span class="tag warn">DDL 有、未同步</span>' : '<span class="tag bad">同步有、DDL 无</span>'}</td></tr>`).join('') : '<tr><td colspan="6" style="color:var(--muted);text-align:center;padding:24px">字段与同步配置完全一致</td></tr>'}</tbody></table></div>`;
    P.querySelector('.chips').onclick = ev => { const b = ev.target.closest('.chip'); if (b) { DIFFONLY = b.dataset.d === '1'; renderDetail() } };
    return;
  }
  P.innerHTML = `<textarea id="dta" spellcheck="false" style="min-height:${p ? 340 : 260}px" placeholder="粘贴 ${esc(t.table)} 的 CREATE TABLE 语句"></textarea>
    <div class="hint" id="dhint"></div>
    <div class="foot"><button class="btn pri" id="dsave" title="Ctrl+S">保存</button><button class="btn" id="dsaveNext">保存并下一张未录入</button><span class="grow"></span>${e.ddl ? '<button class="btn danger" id="ddel">删除 DDL</button>' : ''}</div>
    ${!t.un && t.fields.length ? `<div class="synced">同步任务当前读取的 ${t.fields.length} 个字段：${t.fields.map(f => `<code>${esc(f.n)}</code>`).join(' ')}</div>` : ''}`;
  const ta = $('#dta'); ta.value = e.ddl || '';
  const check = () => {
    const q = parseDDL(ta.value), h = $('#dhint');
    if (!ta.value.trim()) { h.className = 'hint'; h.textContent = '粘贴后会即时识别表名、字段数和主键'; return null }
    if (q.length !== 1) { h.className = 'hint bad'; h.textContent = q.length ? `识别到 ${q.length} 条 CREATE TABLE，这里只能放一条；多张请用「批量粘贴」` : '没有识别到 CREATE TABLE 语句'; return null }
    const x = q[0], dd = compare(t, x), diffName = !t.un && x.table.toLowerCase() !== t.table.toLowerCase();
    h.className = 'hint ' + (diffName ? 'warn' : 'ok');
    h.textContent = `识别：${x.table} · ${x.cols.length} 个字段 · 主键 ${x.pk.join('、') || '无'}` + (t.un ? '' : ` · DDL 有、未同步 ${dd.add} · 同步有、DDL 无 ${dd.miss}`) + (diffName ? ` · 注意：表名与 ${t.table} 不同，仍按本表保存` : '');
    return x;
  };
  ta.oninput = check; check();
  const doSave = async next => {
    const x = check(); if (!x) { ta.focus(); return }
    if (await save({ [k]: { ...e, ddl: x.ddl, at: now() } }, null, `已保存 ${k}`)) {
      const n = next ? nextTodo(k) : null; TAB = null; if (n) select(n, 1); else { renderList(true); renderDetail() }
    }

  $('#dsave').onclick = () => doSave(false); $('#dsaveNext').onclick = () => doSave(true);
  ta.onkeydown = ev => { if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 's') { ev.preventDefault(); doSave(false) } };
  const dl = $('#ddel'); if (dl) dl.onclick = async ev => {
    const b = ev.currentTarget; if (!b.dataset.c) { b.dataset.c = 1; b.textContent = '再点一次确认删除'; setTimeout(() => { if (b.isConnected) { delete b.dataset.c; b.textContent = '删除 DDL' } }, 3000); return }
    const { ddl, ...rest } = e; if (await save(rest.status ? { [k]: { ...rest, at: now() } } : null, rest.status ? null : [k], `已删除 ${k} 的 DDL`)) { TAB = null; renderList(true); renderDetail() }
  };

}

// ---------------------------------------------------------------- 批量粘贴
let BP = [];
function preview() {
  const ds = $('#bds').value; BP = parseDDL($('#bulk').value).map(p => { const c = matchSrc(p, ds); return { p, cand: c, to: c.length === 1 ? c[0] : '' } });
  renderPv();
}
function renderPv() {
  const box = $('#pv');
  if (!BP.length) { box.innerHTML = $('#bulk').value.trim() ? '<p class="hint bad" style="margin:0">没有识别到 CREATE TABLE 语句</p>' : ''; $('#bsave').disabled = true; $('#bsum').textContent = ''; return }
  const ok = BP.filter(x => x.to).length, amb = BP.filter(x => !x.to && x.cand.length > 1).length, un = BP.filter(x => !x.to && !x.cand.length).length;
  box.innerHTML = `<div class="tw pv" style="max-height:300px"><table><thead><tr><th>DDL 表名</th><th>字段</th><th>对应业务库表</th><th>当前状态</th></tr></thead><tbody>${BP.map((x, i) => `<tr>
    <td class="m">${esc(x.p.table)}</td><td>${x.p.cols.length}</td>
    <td>${x.cand.length > 1 ? `<select class="sel" data-i="${i}"><option value="">选择数据源…</option>${x.cand.map(c => `<option ${x.to === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>` : x.to ? `<span class="mono">${esc(x.to)}</span>` : '<span class="tag bad">未对上（将保存为 ?:' + esc(x.p.table) + '）</span>'}</td>
    <td>${x.to ? `<span class="tag ${ST[state(x.to)][1]}">${E[x.to] && E[x.to].ddl ? '已有 DDL，将覆盖' : ST[state(x.to)][0]}</span>` : ''}</td></tr>`).join('')}</tbody></table></div>`;
  box.querySelectorAll('select[data-i]').forEach(s => s.onchange = () => { BP[+s.dataset.i].to = s.value; renderPv() });
  $('#bsum').textContent = `识别 ${BP.length} 张：对上 ${ok}` + (amb ? `，待选数据源 ${amb}` : '') + (un ? `，未对上 ${un}` : '');
  $('#bsave').disabled = !(ok + un); $('#bsave').textContent = `保存 ${ok + un} 张`;
}
$('#bulk').oninput = preview; $('#bds').onchange = preview;
$('#openBulk').onclick = () => { $('#bulkDlg').showModal(); $('#bulk').focus() };
$('#bsave').onclick = async () => {
  const at = now(), set = {}, ds = $('#bds').value;
  BP.forEach(x => { if (x.to) set[x.to] = { ...(E[x.to] || {}), ddl: x.p.ddl, at }; else if (!x.cand.length) set[`${ds || '?'}:${x.p.table}`] = { ...(E[`${ds || '?'}:${x.p.table}`] || {}), ddl: x.p.ddl, at } });
  const left = BP.filter(x => !x.to && x.cand.length > 1);
  if (await save(set, null, `批量保存 ${Object.keys(set).length} 张`)) {
    renderList(true); renderDetail();
    if (left.length) { $('#bulk').value = left.map(x => x.p.ddl).join('\n\n'); preview(); toast(`还有 ${left.length} 张需要选数据源`) } else { $('#bulk').value = ''; BP = []; renderPv(); $('#bulkDlg').close() }
  }
};
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => b.closest('dialog').close());

// ---------------------------------------------------------------- 快捷键 / 启动
document.addEventListener('keydown', e => {
  if (document.querySelector('dialog[open]')) return;
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (e.key === '/' && !typing) { e.preventDefault(); $('#q').focus() }
  else if (e.key.toLowerCase() === 'b' && !typing && !e.ctrlKey && !e.metaKey) { e.preventDefault(); $('#openBulk').click() }
  else if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && !typing) { $('#list').focus(); $('#list').onkeydown(e) }
});
(async () => {
  try {
    const j = await (await fetch('/api/state', { cache: 'no-store' })).json();
    TABLES = j.tables || []; E = j.entries || {};
    TABLES.forEach(t => { TBY[t.name] = t; (IDX[t.table.toLowerCase()] ??= []).push(t.name) });
    $('#file').textContent = j.file; $('#file').title = j.file;
    const dss = [...new Set(TABLES.map(t => t.ds))].sort();
    for (const id of ['#fds', '#bds']) dss.forEach(d => { const o = document.createElement('option'); o.textContent = d; $(id).appendChild(o) });
    renderList(); renderDetail();
  } catch (err) {
    document.body.innerHTML = '<div class="empty" style="padding:80px 20px"><div class="big">没连上工具服务</div><div>请双击 <code>启动.bat</code>（或运行 <code>python3 dataworks/ddl_tool/server.py</code>），用它自动打开的地址访问，不要直接双击 index.html。</div></div>';
  }
})();
